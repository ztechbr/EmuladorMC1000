services:
  mc1000:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
